[package]
name = "tungsten-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
desktop = ["dep:adw", "dep:gtk"]

[dependencies]
adw = { package = "libadwaita", version = "=0.9.2", optional = true, features = [
  "v1_9",
] }
gtk = { package = "gtk4", version = "=0.11.5", optional = true, features = [
  "v4_18",
] }
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "query",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "fs",
  "io-util",
] }
tokio-util = { version = "0.7", features = ["io"] }
tungsten = { version = "=0.1.0", path = "..", default-features = false }
tungsten-linux-model = { version = "=0.1.0", path = "model" }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
tokio = { version = "1.48", features = ["macros", "net"] }
tungsten = { version = "=0.1.0", path = "..", features = ["server"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
