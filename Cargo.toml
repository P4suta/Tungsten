[workspace]
members = ["xtask", "linux", "linux/model"]
resolver = "3"

[package]
name = "tungsten"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["server"]
server = [
  "storage",
  "dep:axum",
  "dep:clap",
  "dep:include_dir",
  "dep:tokio",
  "dep:tower-http",
  "dep:tower",
  "dep:futures-util",
]
storage = [
  "dep:base64",
  "dep:rusqlite",
  "dep:rustix",
  "dep:serde_json",
  "dep:uuid",
  "dep:tempfile",
]

[[bin]]
name = "tungsten"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
axum = { version = "0.8.9", optional = true, default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
clap = { version = "4.5", optional = true, features = ["derive"] }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = [
  "html",
] }
rustix = { version = "1.1.6", optional = true, features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11.1"
thiserror = "2.0"
tokio = { version = "1.48", optional = true, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "time",
  "sync",
  "fs",
  "io-util",
] }
uuid = { version = "1.18", optional = true, features = ["v4"] }
tempfile = { version = "3.27", optional = true }
include_dir = { version = "=0.7.4", optional = true }
rusqlite = { version = "=0.41.1", optional = true, default-features = false, features = [
  "bundled",
  "blob",
  "cache",
  "hooks",
  "functions",
] }
tower-http = { version = "=0.7.1", optional = true, default-features = false, features = [
  "compression-gzip",
  "compression-br",
] }
tower = { version = "0.5", optional = true, features = ["util"] }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = [
  "std",
] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
