[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib", "blessing"]

[[licenses.exceptions]]
name = "varint-rs"
version = "=2.2.1"
allow = ["0BSD"]

[[licenses.exceptions]]
name = "xxhash-rust"
version = "=0.8.19"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "aws-lc-rs"
version = "=1.19.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-sys"
version = "=0.47.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "rustls-webpki"
version = "=0.103.16"
allow = ["ISC"]

[[licenses.exceptions]]
name = "untrusted"
version = "=0.9.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.13.5"
allow = ["Apache-2.0 WITH LLVM-exception"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.12"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
