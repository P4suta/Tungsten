[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib"]

[[licenses.exceptions]]
name = "sqlcipher-src"
version = "=419.0.6"
allow = ["MIT", "BSD-3-Clause", "blessing", "WTFPL"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
