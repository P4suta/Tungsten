name: Verify candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Verify Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder ostree xvfb dbus-x11
      - run: flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - run: flatpak --user install --assumeyes --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - env:
          ARCH: ${{ matrix.arch }}
        run: mise x -- just linux bundle --arch "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/linux
          retention-days: 7
          if-no-files-found: error
  apple:
    name: Verify Apple candidate
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - run: mise x -- npm --prefix ui ci
      - run: mise x -- just apple check
      - run: mise x -- just apple build macos --release
      - run: mise x -- just apple build ios --release
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROSE_SOURCE: ${{ github.workspace }}/target/shared-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ui/package-lock.json', 'mise.toml', '.github/workflows/*.yml') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: P4suta/dotfiles
          ref: f912fad08fb356ba6c04c60cb7fe5e37d5c5ce36
          path: target/shared-tools
          persist-credentials: false
      - run: cargo install --locked --path target/shared-tools/crates/prose --force
      - run: cargo install --locked --path target/shared-tools/crates/dotfiles --bin dotfiles --force
      - run: git config prose.standard true
      - run: mise x -- cargo xtask docs
      - run: npm --prefix ui ci
      - run: npm --prefix ui exec -- playwright install --with-deps chromium firefox webkit
      - run: mise x -- just release-check
      - run: mise x -- just artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-executables
          path: dist
          retention-days: 7
          if-no-files-found: error
