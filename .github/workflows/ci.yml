name: Checks
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      apple: ${{ steps.apple-scope.outputs.affected }}
      linux: ${{ steps.linux-scope.outputs.affected }}
    env:
      PROSE_SOURCE: ${{ github.workspace }}/target/shared-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target
          key: checks-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ui/package-lock.json', 'mise.toml', '.github/workflows/*.yml') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: P4suta/dotfiles
          ref: f912fad08fb356ba6c04c60cb7fe5e37d5c5ce36
          path: target/shared-tools
          persist-credentials: false
      - run: cargo install --locked --path target/shared-tools/crates/prose --force
      - run: cargo install --locked --path target/shared-tools/crates/dotfiles --bin dotfiles --force
      - run: git config prose.standard true
      - run: mise x -- cargo xtask docs
      - id: apple-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: mise x -- cargo xtask apple affected --base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - id: linux-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: mise x -- just linux affected --base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - run: npm --prefix ui ci
      - run: npm --prefix ui exec -- playwright install --with-deps chromium firefox webkit
      - run: mise x -- just check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-failure-traces
          path: ui/test-results
          retention-days: 7
          if-no-files-found: ignore
  apple:
    name: Check Apple apps
    needs: check
    if: needs.check.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/apple-package
            target/apple-build
          key: apple-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apple/Package.swift', 'apple/project.yml', 'mise.toml') }}
      - run: mise x -- npm --prefix ui ci
      - run: mise x -- just apple check
  linux:
    name: Check Linux app
    needs: check
    if: needs.check.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44@sha256:f08613fffc95f5c85c019b2f4ac9e9fb9bb84b9cfd59275671b84169567b157e
    timeout-minutes: 20
    steps:
      - run: dnf install -y gcc gcc-c++ cmake pkgconf-pkg-config gtk4-devel libadwaita-devel xorg-x11-server-Xvfb dbus-x11 desktop-file-utils appstream google-noto-sans-cjk-vf-fonts git tar gzip xz which unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'linux/**', 'mise.toml') }}
      - run: mise x -- npm --prefix ui ci
      - run: mise x -- npm --prefix ui run build
      - run: mise x -- just linux check
  complete:
    name: Check applicable targets
    needs: [check, apple, linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - if: needs.check.result != 'success' || (needs.apple.result != 'success' && needs.apple.result != 'skipped') || (needs.linux.result != 'success' && needs.linux.result != 'skipped')
        run: exit 1
