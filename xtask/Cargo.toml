[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "=0.41.1", default-features = false, features = [
  "bundled",
] }
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.27.2"
tree-sitter-typescript = "0.23.2"
syn = { version = "2.0", features = ["full", "visit"] }
toml = "=1.2.1"
roxmltree = "0.21"
tempfile = "3.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
redb = "=4.5.0"
fjall = "=3.1.13"
uuid = { version = "1.18", features = ["v4"] }
rustix = { version = "1.1.6", features = ["fs"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
tungsten = { version = "=0.1.0", path = "..", default-features = false, features = [
  "storage",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
