[package]
name = "tungsten-fuzz"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "rules"
path = "fuzz_targets/rules.rs"
test = false
doc = false
bench = false

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
